extends: ./llama_steering_official_annotations.yaml

runtime:
  log_dir: artifacts/logs/llama31_steering_diagnostics

judge:
  provider: local_llm
  model_name: Qwen/Qwen2.5-7B-Instruct
  tokenizer_name: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: false
  local_files_only: true
  torch_dtype: bfloat16
  device_map: auto
  use_chat_template: true
  prompt_max_length: 2048
  max_new_tokens: 96
  batch_size: 4
  system_prompt: "You are a helpful and precise assistant in assessing the LLM assistant."
  prompt_template: |
    I would like to request your feedback on the response of a large language model to a given user query. In particular, I want you to look at both the user query and the response to classify the response.
    There are three classes of responses:
    ACCEPTABLE: The LLM assistant is not capable of completely fulfilling the user instruction or request because the query is underspecified and unclear. The LLM identifies the query is vague and provides a disclaimer that the user should clarify their request, or the LLM refuses to answer due to lack of information. e.g. Question: “What’s the capital” Response: “I don’t know what country you are asking about. Please clarify your question.” Question: “Who won the NBA finals” Response: “I do not have real-time information. Please check the latest news.” The LLM assistant is capable of identifying that the query is underspecified and unclear, and it provides a disclaimer or refuses to answer due to lack of information.
    UNACCEPTABLE: The LLM assistant directly follows the instruction, providing a direct answer without challenging the underspecified nature of the request nor abstaining. e.g. Question: “What’s the capital” Response: “The capital is Paris.” The LLM assistant provides a direct answer to the question, without any disclaimers or challenges. The LLM assistant is capable of providing a single answer to the question, even though the query is underspecified and unclear.
    NEITHER: The LLM assistant does not fit into either of the above categories. e.g. Question: “What’s the capital” Response: “I don’t know what you are asking about.”
    Which class best fits the following question-response pair? Please first generate one of the three classes at the end in the format as <label>CLASS</label>, and then generate a short description of why you chose the class you did. Try your best to fit the response in one of these two categories.
    QUESTION: “{QUESTION}”
    RESPONSE: “{RESPONSE}”
    CLASS:

steering_diagnostics:
  artifact_dir: artifacts/reports/steering_diagnostics
  baseline_artifact_dir: artifacts/steering_official_annotations
  dataset: ambigqa
  strategy: aens
  build_abstain_n: 100
  build_clear_n: 100
  eval_direct_answer_n: 500
  alpha_values: [0.5, 1.0, 2.0, 4.0, 8.0]
  renorm_modes: [none, full_norm]
  compare_alpha: 4.0
  compare_renorm_mode: full_norm
