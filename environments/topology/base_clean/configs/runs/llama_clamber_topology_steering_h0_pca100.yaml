extends: ./llama_clamber_topology_steering.yaml

runtime:
  log_dir: artifacts/logs/llama_clamber_topology_steering_h0_pca100

token_cloud_topology_classifier:
  pca_fit_token_cap: 32000
  pca_components: 100
  topology_components: 100
  maxdim: 0

clamber_subclass_classification:
  token_cloud_candidate_layers: [14]
  token_cloud_pca_components: 100
  token_cloud_topology_components: 100
  token_cloud_distance_feature_mode: none

clamber_topology_steering:
  output_dir: artifacts/reports/clamber_topology_steering_h0_pca100
  surrogate_checkpoint_path: artifacts/reports/clamber_topology_surrogate_h0_pca100/meta_llama_Llama_3.1_8B_Instruct/layer_14__surrogate.pt
  token_cloud_forward_cache_path: artifacts/reports/clamber_topology_surrogate_h0_pca100/meta_llama_Llama_3.1_8B_Instruct/clamber_token_cloud_reduced_clouds.joblib
  token_cloud_feature_cache_path: artifacts/reports/clamber_topology_surrogate_h0_pca100/meta_llama_Llama_3.1_8B_Instruct/clamber_token_cloud_all_layer_features.parquet
  reducer_cache_path: artifacts/reports/clamber_topology_steering_h0_pca100/meta_llama_Llama_3.1_8B_Instruct/layer_14__pca100_reducer.joblib
  use_reliable_target_subset: false
  build_split: train
  build_abstain_n: 100
  build_direct_n: 100
  eval_split: test
  eval_direct_answer_n: 50
  alpha: 1.0
  lambda_l2: 100.0
  opt_steps: 80
  opt_lr: 0.05
  generation_batch_size: 2
  judge_outputs: false
